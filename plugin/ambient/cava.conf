# cava for the Amplify ambient field (plugin/ambient/AmbientLayer.qml, task 523461dd).
# Started only while an MPRIS player reports Playing; 30 frames a second at most
# (the field drops anything faster, plugin/perf/perf.js FPS_CAP).
[general]
framerate = 30
bars = 16
autosens = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono
